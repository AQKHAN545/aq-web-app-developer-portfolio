    .cv-page{min-height:100vh;padding:28px 0 70px}.cv-page .container{max-width:1100px}.cv-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.cv-toolbar .toolbar-actions{display:flex;gap:10px;flex-wrap:wrap}.cv-toolbar a,.cv-toolbar button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--line-strong);background:rgba(8,16,31,.75);color:var(--text);border-radius:12px;padding:11px 15px;font-weight:800;font-size:12px;cursor:pointer}.cv-toolbar .primary{background:linear-gradient(135deg,var(--cyan),#8160ff);color:#04101b;border:0}.cv-image-wrap{border:1px solid rgba(71,213,255,.25);border-radius:24px;padding:12px;background:linear-gradient(135deg,rgba(19,216,255,.07),rgba(136,90,255,.08));box-shadow:0 30px 100px rgba(0,0,0,.35)}.cv-image-wrap img{width:100%;height:auto;display:block;border-radius:17px}.cv-note{margin:14px 4px 0;color:var(--muted);font-size:12px;text-align:center}.cv-footer{text-align:center;color:var(--muted);font-size:11px;margin-top:18px}@media(max-width:640px){.cv-toolbar{flex-direction:column;align-items:stretch}.cv-toolbar .toolbar-actions{width:100%}.cv-toolbar a,.cv-toolbar button{flex:1}}
